[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-remote-control"
version = "0.1.0"
description = "Low-latency browser remote control for an Ubuntu host on a LAN"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4",
  "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
local-remote-control = "local_remote_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_remote_control = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
